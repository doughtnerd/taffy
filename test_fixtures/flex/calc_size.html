<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    calc() widths and heights, with min() and clamp()
  </title>
</head>
<body>

<div id="test-root" style="width: 400px; height: 300px; align-items: flex-start;">
  <div style="width: calc(50% - 12px); height: calc(100% - 20px);"></div>
  <div style="width: min(25%, 60px); height: clamp(10px, 10%, 20px);"></div>
  <div style="width: max(10%, 30px); height: calc((50% + 10px) / 2);"></div>
</div>

</body>
</html>
