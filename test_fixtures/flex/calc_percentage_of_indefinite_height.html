<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    A calc() height with a percentage, against an auto-height parent, is auto; a percentage-free one is a length
  </title>
</head>
<body>

<div id="test-root" style="flex-direction: column; width: 400px; align-items: flex-start;">
  <div style="width: 20px; height: calc(50% + 10px);">
    <div style="height: 30px;"></div>
  </div>
  <div style="width: 20px; height: calc(10px + 5px);"></div>
</div>

</body>
</html>
