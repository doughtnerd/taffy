<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    calc() row and column gaps in a wrapping flex container
  </title>
</head>
<body>

<div id="test-root" style="width: 400px; height: 300px; flex-wrap: wrap; align-content: flex-start; column-gap: calc(5% - 5px); row-gap: calc(10% - 20px);">
  <div style="width: 150px; height: 20px;"></div>
  <div style="width: 150px; height: 20px;"></div>
  <div style="width: 150px; height: 20px;"></div>
</div>

</body>
</html>
