<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    calc() padding and margins resolve against the containing block's width
  </title>
</head>
<body>

<div id="test-root" style="width: 400px; height: 300px;">
  <div style="width: 400px; height: 300px; align-items: flex-start; padding: calc(5% + 2px);">
    <div style="width: 100px; height: 40px; margin-left: calc(10% - 10px); margin-top: calc(5% + 6px);"></div>
    <div style="width: 50px; height: 40px; margin-left: auto; margin-right: calc(2% + 1px);"></div>
  </div>
</div>

</body>
</html>
