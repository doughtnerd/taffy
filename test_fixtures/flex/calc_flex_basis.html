<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../scripts/gentest/test_helper.js"></script>
  <link rel="stylesheet" type="text/css" href="../../scripts/gentest/test_base_style.css">
  <title>
    calc() flex-basis
  </title>
</head>
<body>

<div id="test-root" style="width: 500px; height: 100px;">
  <div style="flex-basis: calc(40% - 20px); flex-shrink: 0; height: 20px;"></div>
  <div style="flex-basis: calc(20% + 10px); flex-shrink: 0; height: 20px;"></div>
  <div style="flex-basis: calc(10% * 2); flex-grow: 1; height: 20px;"></div>
</div>

</body>
</html>
